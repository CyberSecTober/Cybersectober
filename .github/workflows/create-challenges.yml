name: Create challenges

on:
  push:
    branches: [main]
    paths:
      - data/challenges.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - name: Create any challenges that don't exist yet
        run: python3 scripts/create_challenges.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
