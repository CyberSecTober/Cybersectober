name: Award badges

on:
  pull_request_target:
    types: [closed, labeled]
    branches: [main]
  push:
    branches: [main]
    paths:
      - data/manual-awards.json
      - data/organizers.json
      - scripts/award_badges.py
      - .github/workflows/award-badges.yml
      - badges/**
      - site/**
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Merged pull request number to post (or refresh) the award comment on. Leave empty to only rebuild the site."
        required: false

permissions:
  contents: read

concurrency:
  group: award-badges
  cancel-in-progress: false

jobs:
  award:
    # Never checks out or runs code from the pull request itself; only reads PR metadata through the API.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      pages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        continue-on-error: true
      - name: Install the markdown renderer for contribution pages
        run: pip install --quiet markdown==3.11 nh3==0.3.7
      - name: Award points and badges, build verification site
        run: python3 scripts/award_badges.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          OUT_DIR: _site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: award
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
